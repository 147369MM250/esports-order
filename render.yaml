services:
  - type: web
    name: esports-order-system
    env: node
    plan: free
    buildCommand: npm install && npm run build:prod
    startCommand: ./start.sh
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVER_HOST
        value: 0.0.0.0
      - key: SERVER_PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        value: "18131138682"
